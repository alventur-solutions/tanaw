[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanaw"
version = "0.1.0"
description = "Topographic Assessment for National Adaptation Works"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "mangum>=0.19,<1",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "geoalchemy2",
    "alembic",
    "pydantic-settings",
    "earthengine-api",
    "pandas",
    "geopandas",
    "shapely",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["api*", "pipeline*", "funding*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
