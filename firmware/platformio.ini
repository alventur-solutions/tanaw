; TANAW ESP32 flood/climate station
; Build with: pio run -d firmware
; Hardware: ESP32, DHT22, JSN-SR04T ultrasonic / analog water sensor,
; SSD1306 OLED, buzzer, status LEDs.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
