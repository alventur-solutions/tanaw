; TANAW ESP32 flood/climate station (with HTTPS upload)
; Build with: pio run -d iot/firmware
; Hardware: ESP32, DHT22, analog water sensor, SSD1306 OLED, buzzer, LEDs.
; Before building: copy src/config.example.h to src/config.h and fill it in.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
